name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify tag and package versions
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { BRIDGE_VERSION } from "./bridge/version.mjs";
            const packageVersion = JSON.parse(readFileSync("package.json", "utf8")).version;
            const manifestVersion = JSON.parse(readFileSync("public/manifest.json", "utf8")).version;
            const tagVersion = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            if (new Set([packageVersion, manifestVersion, BRIDGE_VERSION, tagVersion]).size !== 1) {
              throw new Error(`Version mismatch: tag=${tagVersion}, package=${packageVersion}, manifest=${manifestVersion}, bridge=${BRIDGE_VERSION}`);
            }
          '
      - run: npm run check
      - run: npm test
      - run: npm run bridge:check
      - run: npm run bridge:smoke
      - run: npm run package:release
      - run: npm run bridge:installer-smoke
      - name: Verify release checksums
        run: cd artifacts && sha256sum -c SHA256SUMS.txt
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --verify-tag \
              --generate-notes \
              --title "Lumen Paper $GITHUB_REF_NAME"
          fi
