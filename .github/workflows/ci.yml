name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run bridge:check
      - run: npm run bridge:smoke
      - run: npm run package:release
      - run: npm run bridge:installer-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-paper-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
